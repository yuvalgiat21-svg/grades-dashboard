<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דשבורד ציוני מחצית ב׳ | פנימיית מבואות ים</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f0f4f8;--card:#fff;--primary:#1e3a5f;--accent:#2e7d9f;
    --accent2:#e8a020;--text:#1a2332;--muted:#6b7fa3;--border:#d0dae8;

    --shadow:0 2px 16px rgba(30,58,95,.10)
  }
  body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl}
  header{background:linear-gradient(135deg,var(--primary) 60%,var(--accent));color:#fff;padding:18px 28px 14px;display:flex;align-items:center;gap:16px;box-shadow:0 4px 18px rgba(30,58,95,.18);flex-wrap:wrap}
  header .logo{font-size:2rem}
  header h1{font-size:1.35rem;font-weight:800}
  header p{font-size:.83rem;opacity:.75;margin-top:2px}
  .save-badge{margin-right:auto;background:rgba(255,255,255,.15);border-radius:20px;padding:4px 14px;font-size:.8rem;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .save-badge.saved{background:rgba(39,174,96,.35)}
  .tabs-bar{display:flex;gap:6px;padding:16px 20px 0;flex-wrap:wrap}
  .tab-btn{padding:9px 20px;border:2px solid var(--border);border-bottom:none;background:var(--card);border-radius:10px 10px 0 0;font-family:'Heebo',sans-serif;font-size:.92rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all .18s}
  .tab-btn:hover{background:#e8f0f8;color:var(--primary)}
  .tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);z-index:2}
  .tab-btn.civic.active{background:var(--accent2);border-color:var(--accent2)}
  .main-card{background:var(--card);margin:0 20px 28px;border-radius:0 12px 12px 12px;box-shadow:var(--shadow);border:1.5px solid var(--border);overflow:hidden}
  .toolbar{display:flex;align-items:center;gap:8px;padding:12px 16px;background:#f4f8fd;border-bottom:1.5px solid var(--border);flex-wrap:wrap}
  .toolbar-title{font-weight:700;font-size:1rem;color:var(--primary);flex:1;min-width:120px}
  .btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:7px;border:none;font-family:'Heebo',sans-serif;font-size:.84rem;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
  .btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#219a52}
  .btn-blue{background:var(--accent);color:#fff}.btn-blue:hover{background:#1f6888}
  .btn-dark{background:var(--primary);color:#fff}.btn-dark:hover{background:#142d4c}
  .btn-red{background:#c0392b;color:#fff;font-size:.78rem;padding:5px 10px}.btn-red:hover{background:#a93226}
  .weight-bar{font-size:.81rem;padding:6px 16px;background:#1a2e4a;color:#aac4e0;border-bottom:1px solid rgba(255,255,255,.08);display:none}
  .stats-strip{display:flex;gap:20px;padding:8px 16px;background:#eef3fa;border-bottom:1.5px solid var(--border);font-size:.81rem;color:var(--muted);flex-wrap:wrap}
  .stats-strip strong{color:var(--primary)}
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:.87rem}
  thead tr{background:var(--primary);color:#fff}
  thead th{padding:9px 7px;font-weight:700;text-align:center;white-space:nowrap;border-left:1px solid rgba(255,255,255,.12);vertical-align:bottom}
  thead th.civic-bg{background:var(--accent2)}
  .weight-chip{display:inline-block;background:rgba(255,255,255,.18);border-radius:10px;padding:1px 7px;font-size:.73rem;font-weight:700;margin-top:3px}
  tbody tr:nth-child(even){background:var(--row-even)}
  tbody tr:hover{background:#deeaf8}
  tbody td{padding:6px 7px;text-align:center;border-bottom:1px solid var(--border);border-left:1px solid #e8eef6}
  td.num-col{font-weight:700;color:var(--muted);font-size:.82rem;width:38px}
  .name-td{text-align:right;padding-right:12px;font-weight:600;color:var(--text);min-width:155px}
  .final-td{font-weight:800;font-size:.97rem;min-width:68px}
  .grade-good{color:var(--green)}.grade-mid{color:var(--accent2)}.grade-bad{color:var(--red)}
  input.cell-edit{width:58px;border:1.5px solid var(--border);border-radius:5px;padding:3px 5px;font-family:'Heebo',sans-serif;font-size:.86rem;text-align:center;background:#f9fbff;display:block;margin:0 auto}
  input.cell-edit:focus{border-color:var(--accent);outline:none;background:#fff}
  input.name-edit{width:100%;min-width:140px;border:1.5px solid var(--border);border-radius:5px;padding:4px 7px;font-family:'Heebo',sans-serif;font-size:.88rem;background:#f9fbff;text-align:right}
  input.name-edit:focus{border-color:var(--accent);outline:none;background:#fff}
  input.note-edit{width:100%;min-width:175px;border:1.5px solid var(--border);border-radius:5px;padding:4px 7px;font-family:'Heebo',sans-serif;font-size:.83rem;background:#fffdf4;text-align:right;color:#5a4a00}
  input.note-edit:focus{border-color:var(--accent2);outline:none}
  .del-btn{background:none;border:none;color:#d5d5d5;cursor:pointer;font-size:1rem;padding:2px 5px;border-radius:4px;line-height:1}
  .del-btn:hover{color:var(--red);background:#fdecea}
  .add-col-dialog,.del-student-dialog{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.48);z-index:200;align-items:center;justify-content:center}
  .add-col-dialog.open,.del-student-dialog.open{display:flex}
  .dialog-box{background:#fff;border-radius:14px;padding:26px 30px;min-width:310px;max-width:440px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,.2);direction:rtl}
  .dialog-box h3{font-size:1.1rem;margin-bottom:14px;color:var(--primary)}
  .dialog-box label{font-size:.88rem;font-weight:600;display:block;margin-bottom:4px;margin-top:10px}
  .dialog-box input,.dialog-box select{width:100%;border:1.5px solid var(--border);border-radius:7px;padding:8px 10px;font-family:'Heebo',sans-serif;font-size:.92rem;direction:rtl;background:#fafbfd}
  .dialog-box input:focus,.dialog-box select:focus{border-color:var(--accent);outline:none}
  .dialog-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  .student-list-del{max-height:260px;overflow-y:auto;border:1.5px solid var(--border);border-radius:8px;margin-top:8px}
  .student-row-del{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid #eef2f8;font-size:.9rem}
  .student-row-del:last-child{border-bottom:none}
  .student-row-del:hover{background:#f4f8ff}
  .badge-h{background:#e8f0fb;color:var(--primary);padding:2px 10px;border-radius:20px;font-size:.75rem;font-weight:700;margin-right:8px}
  .badge-c{background:#fff3d6;color:#a06010;padding:2px 10px;border-radius:20px;font-size:.75rem;font-weight:700;margin-right:8px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1e3a5f;color:#fff;padding:9px 22px;border-radius:28px;font-size:.88rem;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
  .toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <div class="logo">📊</div>
  <div>
    <h1>דשבורד ציוני מחצית ב׳ — כיתות ט׳</h1>
    <p>היסטוריה ואזרחות</p>
  </div>
  <div class="save-badge" id="saveBadge">💾 שומר אוטומטית</div>
</header>

<div class="tabs-bar" id="tabsBar"></div>

<div class="main-card">
  <div class="toolbar">
    <span class="toolbar-title" id="tabTitle">—</span>
    <button class="btn btn-green" onclick="addRow()">➕ הוסף תלמיד</button>
    <button class="btn btn-red" onclick="openDelStudentDialog()">➖ הסר תלמיד</button>
    <button class="btn btn-blue" onclick="openAddColDialog()">📝 הוסף עמודה</button>
    <button class="btn btn-dark" onclick="exportCSV()">⬇️ ייצא CSV</button>
    <button class="btn" style="background:#7c3aed;color:#fff;" onclick="openMissingReport()">📋 דוח חוסרים</button>
  </div>
  <div id="weightBar" class="weight-bar"></div>
  <div id="statsStrip" class="stats-strip"></div>
  <div class="table-wrap">
    <table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table>
  </div>
</div>

<!-- Add Column Dialog -->
<div class="add-col-dialog" id="addColDialog">
  <div class="dialog-box">
    <h3>➕ הוספת עמודה חדשה</h3>
    <label>שם העמודה</label>
    <input type="text" id="newColName" placeholder="לדוג׳: בחן 3">
    <label>משקל % (אופציונלי)</label>
    <input type="number" id="newColWeight" placeholder="לדוג׳: 10" min="0" max="100">
    <div class="dialog-actions">
      <button class="btn" style="background:#eee;color:#555" onclick="closeAddColDialog()">ביטול</button>
      <button class="btn btn-blue" onclick="confirmAddCol()">הוסף ✓</button>
    </div>
  </div>
</div>

<!-- Remove Student Dialog -->
<div class="del-student-dialog" id="delStudentDialog">
  <div class="dialog-box">
    <h3>➖ הסרת תלמיד מהרשימה</h3>
    <p style="font-size:.85rem;color:var(--muted);margin-bottom:8px">בחר תלמיד להסרה מהלשונית הנוכחית:</p>
    <div class="student-list-del" id="studentListDel"></div>
    <div class="dialog-actions">
      <button class="btn" style="background:#eee;color:#555" onclick="closeDelStudentDialog()">סגור</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

const HIST_COLS = [
  {label:'בחן אימפריאליזם',      weight:'10'},
  {label:'בחן 2',      weight:'10'},
  {label:'מטלת חקר',  weight:'25'},
  {label:'פרזנטציה',  weight:'25'},
  {label:'תלמידאות',  weight:'30'},
];
// אזרחות: מטלה 40%, פרזנטציה 40%, תלמידאות 20%
const CIVIC_COLS = [
  {label:'מטלת חקר',  weight:'40'},
  {label:'פרזנטציה',  weight:'40'},
  {label:'תלמידאות',  weight:'20'},
];

const TABS = [
  {id:'t2h', label:'היסטוריה ט׳2', subject:'history', data:T2_DATA, defCols:HIST_COLS},
  {id:'t6h', label:'היסטוריה ט׳6', subject:'history', data:T6_DATA, defCols:HIST_COLS},
  {id:'t7h', label:'היסטוריה ט׳7', subject:'history', data:T7_DATA, defCols:HIST_COLS},
  {id:'t8h', label:'היסטוריה ט׳8', subject:'history', data:T8_DATA, defCols:HIST_COLS},
  {id:'t8c', label:'אזרחות ט׳8',   subject:'civic',   data:T8_DATA, defCols:CIVIC_COLS},
];

const STORAGE_KEY = 'mabOtYam_grades_v4';
const OLD_KEY     = 'mabOtYam_grades_v3';

// ════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════
let state = {};

function makeDefaultState(tab) {
  // tab.data = [[name, exam1_grade], ...]
  const firstColKey = 'c0_' + tab.id;
  return {
    rows: tab.data.map((entry,i) => {
      const name = entry[0];
      const exam1 = entry[1];
      const grades = {};
      if (exam1 !== null && exam1 !== undefined) grades[firstColKey] = String(exam1);
      return {id:'r'+i, name:name, grades:grades, note:''};
    }),
    gradeCols: tab.defCols.map((c,i) => ({key:'c'+i+'_'+tab.id, label:c.label, weight:c.weight})),
  };
}

function loadState() {
  // נסה לטעון v3 (כבר מועבר)
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const p = JSON.parse(saved);
      TABS.forEach(tab => { state[tab.id] = p[tab.id] || makeDefaultState(tab); });
      return;
    }
  } catch(e){}

  // אין v3 — נסה להעביר מ-v2 תוך שמירת ציונים
  let oldData = null;
  try {
    const old = localStorage.getItem(OLD_KEY);
    if (old) oldData = JSON.parse(old);
  } catch(e){}

  TABS.forEach(tab => {
    const fresh = makeDefaultState(tab);
    if (oldData && oldData[tab.id]) {
      const oldTab = oldData[tab.id];
      // מפה: שם → שורה ישנה
      const oldByName = {};
      (oldTab.rows || []).forEach(r => { if(r.name) oldByName[r.name.trim()] = r; });
      // העתק ציונים לתלמידים ברשימה החדשה
      fresh.rows.forEach(row => {
        const match = oldByName[row.name.trim()];
        if (match) {
          // מזג: ציונים ישנים + ציון בחן 1 שכבר הוכנס בברירת מחדל
          const merged = Object.assign({}, row.grades, match.grades || {});
          row.grades = merged;
          row.note = match.note || '';
        }
      });
      // שמור עמודות אם הותאמו
      if (oldTab.gradeCols && oldTab.gradeCols.length) {
        fresh.gradeCols = oldTab.gradeCols;
      }
    }
    state[tab.id] = fresh;
  });

  // שמור כ-v3 לטעינות עתידיות
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}

let saveTimer = null;
function saveState() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      const b = document.getElementById('saveBadge');
      b.className='save-badge saved'; b.textContent='✅ נשמר';
      setTimeout(() => { b.className='save-badge'; b.textContent='💾 שומר אוטומטית'; }, 1800);
    } catch(e) {}
  }, 500);
}

let currentTab = TABS[0].id;

// ════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════
function gc(v) {
  const n = parseFloat(v);
  if (isNaN(n) || v === '') return '';
  return n >= 80 ? 'grade-good' : n >= 60 ? 'grade-mid' : 'grade-bad';
}

function calcFinal(row) {
  const s = state[currentTab]; let tot=0, uw=0;
  s.gradeCols.forEach(c => {
    const w=parseFloat(c.weight)||0, g=parseFloat(row.grades[c.key]);
    if(w>0 && !isNaN(g)) { tot+=g*(w/100); uw+=w; }
  });
  return uw===0 ? null : Math.round((tot/uw)*100);
}

function totalW() {
  return state[currentTab].gradeCols.reduce((s,c)=>s+(parseFloat(c.weight)||0),0);
}

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

// ════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════
function renderTabs() {
  document.getElementById('tabsBar').innerHTML = TABS.map(t =>
    `<button class="tab-btn${t.subject==='civic'?' civic':''}${t.id===currentTab?' active':''}"
      onclick="switchTab('${t.id}')">${t.label}</button>`
  ).join('');
}

function switchTab(id) { currentTab=id; renderAll(); }

function renderAll() {
  renderTabs();
  const tab=TABS.find(t=>t.id===currentTab), s=state[currentTab], isCivic=tab.subject==='civic';

  document.getElementById('tabTitle').innerHTML =
    `<span class="${isCivic?'badge-c':'badge-h'}">${isCivic?'אזרחות':'היסטוריה'}</span>${tab.label}`;

  // weight bar
  const wb=document.getElementById('weightBar'), tw=totalW();
  if (s.gradeCols.some(c=>c.weight!=='')) {
    wb.style.display='';
    const ok=Math.abs(tw-100)<.5;
    wb.innerHTML=`סה"כ משקלות: <strong style="color:${ok?'#4ade80':'#f87171'}">${tw}%</strong> ${ok?'✅ תקין':'⚠️ צריך להגיע ל-100%'}`;
  } else wb.style.display='none';

  // stats
  const total=s.rows.length;
  const graded=s.rows.filter(r=>s.gradeCols.some(c=>r.grades[c.key]!==undefined&&r.grades[c.key]!=='')).length;
  document.getElementById('statsStrip').innerHTML =
    `<span>סה"כ: <strong>${total}</strong> תלמידים</span>
     <span>עם ציון: <strong style="color:var(--green)">${graded}</strong></span>
     <span>ללא ציון: <strong style="color:var(--red)">${total-graded}</strong></span>`;

  renderHead(isCivic, s);
  renderBody(s);
}

function renderHead(isCivic, s) {
  const bg = isCivic ? 'civic-bg' : '';
  document.getElementById('tableHead').innerHTML = `<tr>
    <th class="${bg}" style="width:40px">מס"ד</th>
    <th class="${bg}" style="min-width:155px">שם התלמיד</th>
    ${s.gradeCols.map((col,i)=>`
    <th class="${bg}" style="min-width:78px">
      <input style="background:transparent;border:none;color:#fff;font-family:Heebo,sans-serif;font-size:.82rem;font-weight:700;text-align:center;width:72px;" value="${col.label.replace(/"/g,'&quot;')}" onchange="renameCol(${i},this.value)">
      <button style="background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;font-size:.8rem;padding:0 2px;" onclick="deleteCol(${i})" title="מחק עמודה">✕</button><br>
      <input class="weight-input" type="number" min="0" max="100" value="${col.weight}" placeholder="%" onchange="setWeight(${i},this.value)"
        style="width:46px;padding:2px 4px;border-radius:5px;border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff;font-family:Heebo,sans-serif;font-size:.78rem;text-align:center;font-weight:700;margin-top:3px">
      <span style="font-size:.68rem;opacity:.7;display:block;margin-top:1px">משקל %</span>
    </th>`).join('')}
    <th class="${bg}" style="min-width:70px">ציון סופי</th>
    <th class="${bg}" style="min-width:185px">מלל לתעודה</th>
  </tr>`;
}

function renderBody(s) {
  const tb=document.getElementById('tableBody');
  if(!s.rows.length){tb.innerHTML=`<tr><td colspan="99" style="text-align:center;padding:40px;color:var(--muted)">אין תלמידים.</td></tr>`;return;}
  tb.innerHTML = s.rows.map((row,ri)=>{
    const fin=calcFinal(row);
    const safeNote=(row.note||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    const failRow = fin !== null && fin < 55;
    const rowStyle = failRow ? 'background:#fde8e8 !important;' : '';
    const rowClass = failRow ? 'fail-row' : '';
    return `<tr class="${rowClass}" style="${rowStyle}">
      <td class="num-col" style="${failRow?'background:#fde8e8;':''}">${ri+1}</td>
      <td class="name-td" style="${failRow?'background:#fde8e8;':''}"><input class="name-edit" value="${(row.name||'').replace(/"/g,'&quot;')}" onchange="setName(${ri},this.value)" placeholder="שם" style="${failRow?'background:#fde8e8;':''}"></td>
      ${s.gradeCols.map(col=>{
        const v=row.grades[col.key]!==undefined&&row.grades[col.key]!==''?row.grades[col.key]:'';
        const isEmpty = v === '';
        const cellBg = failRow ? 'background:#fde8e8;' : isEmpty ? 'background:#fff9c4;' : '';
        const inputBg = failRow ? 'background:#fde8e8;' : isEmpty ? 'background:#fff9c4;' : '';
        return `<td class="${gc(v)}" style="${cellBg}"><input class="cell-edit" type="number" min="0" max="100" value="${v}" onchange="setGrade(${ri},'${col.key}',this.value)" placeholder="—" style="${inputBg}border-color:${isEmpty&&!failRow?'#f0c040':'var(--border)'};"></td>`;
      }).join('')}
      <td class="final-td ${gc(fin)}" style="${failRow?'background:#fde8e8;color:#c0392b;':''}">${fin!==null?fin:'—'}</td>
      <td style="${failRow?'background:#fde8e8;':''}"><input class="note-edit" value="${safeNote}" onchange="setNote(${ri},this.value)" placeholder="הערה לתעודה..." style="${failRow?'background:#fde8e8;':''}"></td>
    </tr>`;
  }).join('');
}

// ════════════════════════════════════════════════
// ACTIONS
// ════════════════════════════════════════════════
function addRow() {
  state[currentTab].rows.push({id:'r'+Date.now(), name:'', grades:{}, note:''});
  saveState(); renderAll();
  setTimeout(()=>{const inp=document.querySelectorAll('.name-edit');if(inp.length)inp[inp.length-1].focus();},60);
}

function setName(ri,v){state[currentTab].rows[ri].name=v;saveState();}
function setGrade(ri,key,v){state[currentTab].rows[ri].grades[key]=v;saveState();renderBody(state[currentTab]);}
function setNote(ri,v){state[currentTab].rows[ri].note=v;saveState();}
function setWeight(ci,v){state[currentTab].gradeCols[ci].weight=v;saveState();renderAll();}
function renameCol(ci,v){state[currentTab].gradeCols[ci].label=v;saveState();}

function deleteCol(ci) {
  if(!confirm('למחוק עמודה זו?'))return;
  state[currentTab].gradeCols.splice(ci,1);
  saveState();renderAll();
}

// Add column dialog
const addDlg=document.getElementById('addColDialog');
function openAddColDialog(){addDlg.classList.add('open');document.getElementById('newColName').value='';document.getElementById('newColWeight').value='';setTimeout(()=>document.getElementById('newColName').focus(),50);}
function closeAddColDialog(){addDlg.classList.remove('open');}
function confirmAddCol(){
  const name=document.getElementById('newColName').value.trim();
  if(!name){alert('נא לרשום שם לעמודה');return;}
  const weight=document.getElementById('newColWeight').value.trim();
  state[currentTab].gradeCols.push({key:'col_'+Date.now(),label:name,weight:weight||''});
  saveState();closeAddColDialog();renderAll();
  showToast('עמודה נוספה ✓');
}
addDlg.addEventListener('click',e=>{if(e.target===addDlg)closeAddColDialog();});

// Remove student dialog
const delDlg=document.getElementById('delStudentDialog');
function openDelStudentDialog(){
  const s=state[currentTab];
  const list=document.getElementById('studentListDel');
  if(!s.rows.length){list.innerHTML='<p style="padding:16px;color:var(--muted);text-align:center">אין תלמידים ברשימה</p>';delDlg.classList.add('open');return;}
  list.innerHTML=s.rows.map((row,ri)=>
    `<div class="student-row-del">
      <span>${ri+1}. ${row.name||'(ללא שם)'}</span>
      <button class="btn btn-red" style="padding:3px 10px;font-size:.78rem" onclick="removeStudent(${ri})">הסר</button>
    </div>`
  ).join('');
  delDlg.classList.add('open');
}
function closeDelStudentDialog(){delDlg.classList.remove('open');}
function removeStudent(ri){
  const name=state[currentTab].rows[ri].name||'התלמיד';
  if(!confirm(`להסיר את ${name} מהרשימה?`))return;
  state[currentTab].rows.splice(ri,1);
  saveState();
  showToast(`${name} הוסר ✓`);
  openDelStudentDialog(); // refresh list
  renderAll();
}
delDlg.addEventListener('click',e=>{if(e.target===delDlg)closeDelStudentDialog();});

// Export CSV
function exportCSV(){
  const s=state[currentTab],tab=TABS.find(t=>t.id===currentTab);
  let csv='מס"ד,שם התלמיד,'+s.gradeCols.map(c=>c.label).join(',')+',ציון סופי,מלל לתעודה\n';
  s.rows.forEach((row,i)=>{
    const fin=calcFinal(row);
    csv+=`${i+1},"${(row.name||'').replace(/"/g,'""')}",`+
      s.gradeCols.map(c=>{const v=row.grades[c.key];return v!==undefined&&v!==''?v:'';}).join(',')+
      `,"${fin!==null?fin:''}","${(row.note||'').replace(/"/g,'""')}"\n`;
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}));
  a.download=`ציונים_${tab.label}_מחצית_ב.csv`;
  a.click();
  showToast('הקובץ הורד ✓');
}

renderAll();

// עמודות: מטלת חקר = col idx 2, פרזנטציה = col idx 3
const COL_TASK_IDX  = 2;
const COL_PREZ_IDX  = 3;
const COL_CIVIC_TASK_IDX = 0;
const COL_CIVIC_PREZ_IDX = 1;

let currentSection = 'history';

function getColKey(tabId, colIdx) {
  const s = state[tabId];
  if (!s || !s.gradeCols[colIdx]) return null;
  return s.gradeCols[colIdx].key;
}

function hasGrade(tabId, studentName, colIdx) {
  const s = state[tabId];
  if (!s) return false;
  const key = getColKey(tabId, colIdx);
  if (!key) return false;
  const row = s.rows.find(r => r.name === studentName);
  if (!row) return false;
  const v = row.grades[key];
  return v !== undefined && v !== '' && v !== null;
}

function buildHistoryReport() {
  const tabLabels = { t2h:'ט׳2', t6h:'ט׳6', t7h:'ט׳7', t8h:'ט׳8' };
  let html = '';

  Object.entries(HIST_GROUPS).forEach(([tabId, groups]) => {
    const label = tabLabels[tabId];
    html += `<div style="margin-bottom:20px;">
      <div style="font-weight:800;font-size:1rem;color:#1e3a5f;border-bottom:2px solid #d0dae8;padding-bottom:5px;margin-bottom:10px;">📗 היסטוריה כיתה ${label}</div>`;

    if (!groups.length) {
      html += `<div style="color:#aaa;font-size:.88rem;padding:8px 0;">⏳ נתוני שיבוץ עדיין לא הוזנו</div></div>`;
      return;
    }

    let anyMissing = false;
    groups.forEach(g => {
      const missingTask = g.members.filter(m => !hasGrade(tabId, m, COL_TASK_IDX));
      const missingPrez = g.members.filter(m => !hasGrade(tabId, m, COL_PREZ_IDX));

      if (!missingTask.length && !missingPrez.length) return;
      anyMissing = true;

      html += `<div style="background:#f8fafd;border:1px solid #e0e8f4;border-radius:10px;padding:10px 14px;margin-bottom:8px;">
        <div style="font-weight:700;font-size:.9rem;color:#1e3a5f;margin-bottom:6px;">${g.title}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px;">
          <span style="font-size:.8rem;color:#555;">חברי הקבוצה:</span>
          ${g.members.map(m=>`<span style="background:#e8f0fb;border-radius:5px;padding:1px 8px;font-size:.8rem;">${m}</span>`).join('')}
        </div>`;

      if (missingTask.length) {
        html += `<div style="display:flex;align-items:center;gap:6px;margin-top:4px;">
          <span style="background:#fef9c3;color:#854d0e;border-radius:12px;padding:2px 10px;font-size:.78rem;font-weight:700;">📝 מטלה לא הוגשה</span>
          ${missingTask.map(m=>`<span style="color:#b45309;font-size:.82rem;">${m}</span>`).join(' · ')}
        </div>`;
      }
      if (missingPrez.length) {
        html += `<div style="display:flex;align-items:center;gap:6px;margin-top:4px;">
          <span style="background:#e0f2fe;color:#075985;border-radius:12px;padding:2px 10px;font-size:.78rem;font-weight:700;">🎤 פרזנטציה לא הוצגה</span>
          ${missingPrez.map(m=>`<span style="color:#075985;font-size:.82rem;">${m}</span>`).join(' · ')}
        </div>`;
      }
      html += `</div>`;
    });

    if (!anyMissing) {
      html += `<div style="color:#27ae60;font-size:.88rem;padding:6px 0;">✅ כל הקבוצות הגישו והציגו!</div>`;
    }
    html += `</div>`;
  });

  document.getElementById('missingReportContent').innerHTML = html;
}

function buildCivicReport() {
  const tabId = 't8c';
  const s = state[tabId];
  if (!s) { document.getElementById('missingReportContent').innerHTML = '<p>אין נתונים</p>'; return; }

  // בנה קבוצות אזרחות מתוך ציונים — קבוצות לא ידועות, אז נציג לפי תלמיד
  // תלמידים שחסר להם ציון מטלה או פרזנטציה
  const missingTask = s.rows.filter(r => {
    const key = getColKey(tabId, COL_CIVIC_TASK_IDX);
    const v = r.grades[key];
    return !v || v === '';
  });
  const missingPrez = s.rows.filter(r => {
    const key = getColKey(tabId, COL_CIVIC_PREZ_IDX);
    const v = r.grades[key];
    return !v || v === '';
  });

  // כל מי שחסר לפחות אחד
  const allMissing = new Set([...missingTask.map(r=>r.name), ...missingPrez.map(r=>r.name)]);

  let html = `<div style="font-weight:800;font-size:1rem;color:#a06010;border-bottom:2px solid #f0d080;padding-bottom:5px;margin-bottom:12px;">📘 אזרחות ט׳8</div>`;

  if (allMissing.size === 0) {
    html += `<div style="color:#27ae60;font-size:.9rem;">✅ כל התלמידים הגישו והציגו!</div>`;
  } else {
    html += `<p style="font-size:.82rem;color:#888;margin-bottom:10px;">* שיבוצי הקבוצות באזרחות לא הוזנו — מוצגים לפי תלמיד</p>`;

    if (missingTask.length) {
      html += `<div style="margin-bottom:12px;">
        <div style="background:#fef9c3;color:#854d0e;border-radius:12px;padding:5px 14px;font-size:.85rem;font-weight:700;display:inline-block;margin-bottom:8px;">📝 לא הגישו מטלה (${missingTask.length} תלמידים)</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;">
          ${missingTask.map(r=>`<span style="background:#fffbeb;border:1px solid #fcd34d;border-radius:6px;padding:3px 10px;font-size:.83rem;">${r.name}</span>`).join('')}
        </div>
      </div>`;
    }
    if (missingPrez.length) {
      html += `<div style="margin-bottom:12px;">
        <div style="background:#e0f2fe;color:#075985;border-radius:12px;padding:5px 14px;font-size:.85rem;font-weight:700;display:inline-block;margin-bottom:8px;">🎤 לא הציגו פרזנטציה (${missingPrez.length} תלמידים)</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;">
          ${missingPrez.map(r=>`<span style="background:#f0f9ff;border:1px solid #7dd3fc;border-radius:6px;padding:3px 10px;font-size:.83rem;">${r.name}</span>`).join('')}
        </div>
      </div>`;
    }
  }

  document.getElementById('missingReportContent').innerHTML = html;
}
</script>
